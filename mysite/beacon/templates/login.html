{% extends "base.html" %}
{% block title %} Login - Beacon {% endblock %}
{% block content %}
<div class="login-container">
  <!-- Company Branding -->
  <div class="brand-header">
    <div class="logo">B</div>
    <h1>Beacon</h1>
  </div>
  
  <div class="login-box">
    <h2>Account Login</h2>
    <p>Please enter your credentials.</p>
    
    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Email Address" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required>
      </div>
      
      <button type="submit">Login</button>
    </form>
    
    <p class="note">Don't have an account? <a href="{% url 'sign_up' %}">Sign Up</a></p>
  </div>
</div>

<style>
  .login-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
  }
  
  .brand-header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
    gap: 15px;
  }
  
  .brand-header .logo {
    width: 60px;
    height: 60px;
    background: #fff;
    color: #e67e22;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    border: 2px solid #e67e22;
  }
  
  .brand-header h1 {
    color: #e67e22;
    font-size: 32px;
    font-weight: bold;
    margin: 0;
  }
  
  .login-box {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    width: 350px;
  }
  
  h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #333;
  }
  
  p {
    text-align: center;
    margin-bottom: 20px;
    color: #666;
  }
  
  .form-group {
    margin-bottom: 15px;
  }
  
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
  }
  
  input {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  
  input:focus {
    outline: none;
    border-color: #e67e22;
  }
  
  button {
    width: 100%;
    padding: 12px;
    background: #f7c942;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  
  button:hover {
    background: #f5b700;
  }
  
  .note {
    text-align: center;
    margin-top: 15px;
  }
  
  .note a {
    color: #e67e22;
    text-decoration: none;
  }
  
  .note a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
