{% extends  "base.html" %} {% block title %} SIgn Up Page{% endblock %}
{% block content %} 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .signup-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #42c9f7;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #00a4db;
    }
    p {
      text-align: center;
      margin-top: 15px;
    }
    a {
      color: #0077cc;
      text-decoration: none;
    }
    /* General form fields */
    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      background-color: #fff;
    }

    /* Dropdown specific */
    select {
      appearance: none;              /* removes default arrow (Chrome/Safari) */
      -moz-appearance: none;         /* Firefox */
      -webkit-appearance: none;      /* Safari */
      background: #fff url("data:image/svg+xml;utf8,<svg fill='gray' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") no-repeat right 10px center;
      background-size: 16px;
      cursor: pointer;
    }

    /* Add a hover effect for nicer feel */
    select:hover {
      border-color: #42c9f7;
    }

    /* Focus style (when user clicks into the dropdown) */
    select:focus {
      outline: none;
      border-color: #00a4db;
      box-shadow: 0 0 4px rgba(0,164,219,0.5);
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>Create Account</h2>
    <form action="{% url 'sign_up' %}" method="post">
      {% csrf_token %}
      <!-- Title maps to SQL column 'title' -->
      <select name="title" required>
        <option value="" disabled selected>-- Select Title --</option>
        <option value="Mr">Mr</option>
        <option value="Ms">Ms</option>
      </select>
      <input type="text"     name="full_name"        placeholder="Full Name" required>
      <input type="email"    name="email"            placeholder="Email Address" required>
      <input type="password" name="password"         placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>

  <script>
    // Capture role from query string and set hidden input
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role");
    if(role){
      document.getElementById("role").value = role;
    }
  </script>
</body>
</html>
{% endblock %}
