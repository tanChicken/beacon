{% extends "base.html" %} 
{% block title %} Sign Up Page {% endblock %}

{% block content %} 
<div class="signup-box">
  <h2>Account Sign Up</h2>
  <p>Please fill in all fields.</p>

  <form action="{% url 'sign_up' %}" method="post">
    {% csrf_token %}

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>

    <!-- First & Last Name -->
    <div class="form-group inline-fields">
      <div>
        <label for="first">First Name</label>
        <input type="text" id="first" name="first_name" required>
      </div>
      <div>
        <label for="last">Last Name</label>
        <input type="text" id="last" name="last_name" required>
      </div>
    </div>

    <!-- Title -->
    <div class="form-group title-options">
      <label>Title:</label>
      <label><input type="radio" name="title" value="Mr" required> Mr</label>
      <label><input type="radio" name="title" value="Ms"> Ms</label>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>

    <!-- Sign Up -->
    <button type="submit">Sign Up</button>
  </form>

  <p class="note">
    Already have an account? <a href="{% url 'login' %}">Login</a>
  </p>
</div>

<style>
  .signup-box {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    width: 350px;
    margin: 50px auto;
  }
  h2 {
    text-align: center;
    margin-bottom: 10px;
  }
  p {
    text-align: center;
    margin-bottom: 20px;
    color: #666;
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  .inline-fields {
    display: flex;
    gap: 10px;
  }
  .title-options label {
    margin-right: 10px;
    font-weight: normal;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5dd3c8;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #48b8ad;
  }
  .note {
    margin-top: 15px;
    text-align: center;
  }
  .note a {
    color: #0077cc;
    text-decoration: none;
  }
</style>
{% endblock %}
